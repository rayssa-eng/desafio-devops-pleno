# apps/service-2/chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-2-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "service-2-chart.name" . }}