# apps/service-2/chart/templates/authorization-policy.yaml
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "service-2-chart.fullname" . }}-policy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ include "service-2-chart.name" . }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals: 
        {{- $serviceName := index .Values.authPolicy.allowFrom 0 }}
        - {{ printf "cluster.local/ns/%s/sa/%s-sa" $serviceName $serviceName | quote }}